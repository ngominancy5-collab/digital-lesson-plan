# Render Blueprint for PlanWise AI
# https://render.com/docs/blueprint-spec
#
# One Node web service runs the Express API and serves the built React app
# from /dist (see backend/src/server.js). Postgres is hosted on Neon
# (https://neon.tech); DATABASE_URL is an external secret set in Render.
#
# Use Neon's DIRECT (non-pooled) connection string — the one whose host does
# NOT contain "-pooler". `prisma db push` runs at startup and needs a direct
# connection (pooled PgBouncer connections break schema operations).
# Append `?sslmode=require` if it is not already present.
#
# Deploy: push this repo to GitHub, then in Render:
#   New + > Blueprint > pick this repo > Apply.
# Render will prompt for the values marked `sync: false`.

services:
  - type: web
    name: planwise-ai
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm --prefix backend run db:generate
    startCommand: npm --prefix backend run db:push && npm --prefix backend start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Neon Postgres connection string (DIRECT, not the -pooler host).
      # e.g. postgresql://user:pass@ep-xxx.aws.neon.tech/planwise?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Auth
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

      # Public URL of this service (e.g. https://planwise-ai.onrender.com).
      # Used for CORS and password-reset links.
      - key: CLIENT_URL
        sync: false

      # Gemini (server-side only — never expose to the browser).
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: AI_PROVIDER
        value: gemini

      # First administrator — created only when the database has no admin yet.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: PlanWise Administrator

      # Email is intentionally not used. Account-setup and password-reset links
      # are returned by the API and shown in the UI, and administrators share the
      # temporary password shown after approving an account. CLIENT_URL above is
      # used to build those links.

      # Uploaded-file storage (ephemeral on the free plan).
      - key: FILE_STORAGE_PATH
        value: ./uploads
      - key: FILE_STORAGE_URL
        value: /uploads
