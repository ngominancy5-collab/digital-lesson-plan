# Render Blueprint for PlanWise AI
# https://render.com/docs/blueprint-spec
#
# One Node web service runs the Express API and serves the built React app
# from /dist (see backend/src/server.js). Postgres is hosted on Neon
# (https://neon.tech); set DATABASE_URL + DATABASE_URL_UNPOOLED as secrets.
#
# Neon:
#   DATABASE_URL          = pooled URL (host contains "-pooler") — app traffic
#   DATABASE_URL_UNPOOLED = direct URL (no "-pooler") — prisma db push at start
# Append ?sslmode=require if missing. Do not wrap URLs in quotes.
#
# Deploy: push this repo to GitHub, then in Render:
#   New + > Blueprint > pick this repo > Apply.
# Render will prompt for the values marked `sync: false`.

services:
  - type: web
    name: planwise-ai
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm --prefix backend run db:generate
    # Falls back to DATABASE_URL when DATABASE_URL_UNPOOLED is missing (see prod-start.mjs).
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Neon pooled (app)
      - key: DATABASE_URL
        sync: false

      # Neon direct (Prisma migrations / db push)
      - key: DATABASE_URL_UNPOOLED
        sync: false

      # Auth
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

      # Public URL of this service (e.g. https://planwise-ai-bmj3.onrender.com).
      # Used for CORS and password-reset links. No trailing slash.
      - key: CLIENT_URL
        sync: false

      # Gemini (server-side only — never expose to the browser).
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: AI_PROVIDER
        value: gemini

      # Bootstrap administrator — created or password-synced on every boot.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: PlanWise Administrator

      # Email (optional). Render's free plan blocks SMTP, so mail is sent over
      # HTTPS via a provider API. If these are unset, setup/reset links and the
      # approved temporary password are still shown in the UI.
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_API_SECRET
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_HTTP_PROVIDER
        value: mailjet

      # Uploaded-file storage (ephemeral on the free plan; extracted text lives in Neon).
      - key: FILE_STORAGE_PATH
        value: ./uploads
      - key: FILE_STORAGE_URL
        value: /uploads
